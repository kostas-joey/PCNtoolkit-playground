name: pcntoolkit-playground
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=1.23   
  - scipy>=1.9
  - pandas>=1.5
  - matplotlib>=3.6
  - seaborn>=0.12
  - scikit-learn>=1.1
  - jupyter
  - ipykernel
  - nibabel>=4.0
  - nilearn>=0.10
  - pip:
      - pcntoolkit>=0.30
      - torch  # CPU by default; see SETUP.md for GPU instructions
